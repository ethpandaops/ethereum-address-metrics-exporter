name: Attest and mirror to Docker Hub
description: >
  Attests images already pushed to ghcr.io/ethpandaops/<image> and asks the
  central mirror to copy them to Docker Hub, waiting until it has. Run it in
  the same job that built and pushed the images, so the attestation records
  the runner that built them. The job needs id-token: write, attestations: write
  and packages: read.

inputs:
  image:
    description: Package name under ghcr.io/ethpandaops/ (must be in the mirror's images.yaml)
    required: true
  tags:
    description: Whitespace-separated tags already pushed to ghcr.io/ethpandaops/<image>
    required: true
  mirror:
    description: Set to "false" to attest only, without copying to Docker Hub
    default: "true"
  app-id:
    description: ID of the GitHub App that may trigger the mirror (vars.IMAGE_MIRROR_APP_ID)
    required: false
  app-private-key:
    description: Private key of that App (secrets.IMAGE_MIRROR_APP_PRIVATE_KEY)
    required: false
  github-token:
    description: Token that can read the GHCR package
    default: ${{ github.token }}

outputs:
  digests:
    description: Space-separated tag@digest pairs that were attested
    value: ${{ steps.resolve.outputs.pairs }}
  mirror-run-url:
    description: URL of the mirror run
    value: ${{ steps.wait.outputs.url }}

runs:
  using: composite
  steps:
    - name: Install regctl
      shell: bash
      run: "$GITHUB_ACTION_PATH/../../../scripts/install-regctl.sh"

    - name: Resolve digests
      id: resolve
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        TAGS: ${{ inputs.tags }}
        GHCR_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        [[ $IMAGE =~ ^[a-z0-9][a-z0-9._-]{0,127}$ ]] || { echo "::error::invalid image name"; exit 1; }
        src="ghcr.io/ethpandaops/${IMAGE}"
        regctl registry login ghcr.io -u x-access-token --pass-stdin <<<"$GHCR_TOKEN" >/dev/null

        declare -A seen
        tree() {
          local d=$1
          [[ -n ${seen[$d]:-} ]] && return 0
          seen[$d]=1
          while read -r child; do
            [[ -n $child ]] && tree "$child"
          done < <(regctl manifest get "${src}@${d}" --format raw-body | jq -r '(.manifests // [])[]
            | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
            | .digest')
        }

        pairs=()
        for tag in $TAGS; do
          d=$(regctl image digest "${src}:${tag}")
          pairs+=("${tag}@${d}")
          tree "$d"
        done

        checksums="${RUNNER_TEMP}/image-mirror-subjects.txt"
        : > "$checksums"
        for d in "${!seen[@]}"; do
          echo "${d#sha256:}  ${src}" >> "$checksums"
        done
        echo "Attesting ${#seen[@]} manifests for ${#pairs[@]} tags"
        echo "pairs=${pairs[*]}" >> "$GITHUB_OUTPUT"
        echo "checksums=${checksums}" >> "$GITHUB_OUTPUT"

    - name: Attest
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-checksums: ${{ steps.resolve.outputs.checksums }}

    - name: Get mirror trigger token
      id: app-token
      if: inputs.mirror == 'true'
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
        owner: ethpandaops
        repositories: image-mirror
        permission-actions: write

    - name: Trigger mirror and wait
      id: wait
      if: inputs.mirror == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        IMAGE: ${{ inputs.image }}
        PAIRS: ${{ steps.resolve.outputs.pairs }}
      run: |
        set -euo pipefail
        repo=ethpandaops/image-mirror
        rid="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RANDOM}${RANDOM}"
        start=$(date +%s)
        gh workflow run mirror.yml -R "$repo" --ref main \
          -f image="$IMAGE" -f tags="$PAIRS" -f request_id="$rid" \
          -f source_run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

        run_id=""
        for _ in $(seq 1 60); do
          run_id=$(gh run list -R "$repo" -w mirror.yml -e workflow_dispatch -L 30 \
            --json databaseId,displayTitle \
            --jq "map(select(.displayTitle | endswith(\" ${rid}\")))[0].databaseId // empty")
          [[ -n $run_id ]] && break
          sleep 2
        done
        [[ -n $run_id ]] || { echo "::error::mirror run for request ${rid} did not start"; exit 1; }

        url="${GITHUB_SERVER_URL}/${repo}/actions/runs/${run_id}"
        echo "url=${url}" >> "$GITHUB_OUTPUT"
        echo "Mirror run: ${url}"
        status=0
        gh run watch "$run_id" -R "$repo" --exit-status --interval 5 >/dev/null || status=$?
        echo "Mirror finished in $(( $(date +%s) - start ))s after dispatch: ${url}"
        echo "Mirror: ${url} ($(( $(date +%s) - start ))s after dispatch)" >> "$GITHUB_STEP_SUMMARY"
        exit $status
